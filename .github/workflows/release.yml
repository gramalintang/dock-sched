name: Build & Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest       # Apple Silicon (M1/M2/M3/M4)
            label: macos-apple-silicon
          - os: macos-15-intel     # Mac Intel
            label: macos-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - run: mvn -B -ntp package

      - name: Versi
        run: |
          # Tag v1.1-h2: LABEL=1.1-h2 untuk nama berkas, VER=1.1 untuk jpackage (hanya menerima angka).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then L="${GITHUB_REF_NAME#v}"; else L="1.0-dev"; fi
          echo "LABEL=$L" >> "$GITHUB_ENV"
          echo "VER=${L%%-*}" >> "$GITHUB_ENV"

      # jpackage membundel runtime Java, jadi user tidak perlu memasang Java.
      - name: Paket aplikasi
        run: |
          mkdir -p input/lib out
          cp target/DOCK-SCHED.jar input/
          cp target/lib/*.jar input/lib/
          ARGS=(--name DOCK-SCHED --input input --main-jar DOCK-SCHED.jar
                --main-class com.docksched.Main --app-version "$VER"
                --vendor DOCK-SCHED --dest out)
          if [ "${{ matrix.label }}" = windows ]; then
            jpackage --type app-image "${ARGS[@]}"
            (cd out && 7z a -tzip "../DOCK-SCHED-$LABEL-windows.zip" DOCK-SCHED)
          else
            jpackage --type dmg --mac-package-identifier com.docksched "${ARGS[@]}"
            mv out/*.dmg "DOCK-SCHED-$LABEL-${{ matrix.label }}.dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DOCK-SCHED-${{ matrix.label }}
          path: DOCK-SCHED-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: DOCK-SCHED-*
          generate_release_notes: true
